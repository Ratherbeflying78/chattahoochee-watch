name: Update data and deploy

on:
  schedule:
    # 06:10 and 18:10 UTC daily — after ERA5 archive refreshes
    - cron: '10 6,18 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh rainfall climatology
        run: python scripts/build_climatology.py
        continue-on-error: true

      - name: Refresh Chattahoochee Riverkeeper samples
        run: python scripts/build_crk.py
        continue-on-error: true

      - name: Snapshot gauge readings
        run: python scripts/snapshot.py
        continue-on-error: true

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "chore: refresh water and rainfall data [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              git pull --rebase origin main
            done
          else
            echo "No data changes to commit."
          fi

      - name: Stamp asset URLs with the commit
        # Pages serves assets with a 10-minute cache. Without a changing query
        # string a browser can pair a fresh index.html with a stale app.js,
        # which renders the page with cards that never fill in.
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::12}/g" index.html

      - name: Add GPT preview below production root
        uses: actions/checkout@v4
        with:
          ref: ratherbeflying78-gpt-dashboard-redesign
          path: preview

      - name: Stage GPT preview
        run: |
          mkdir -p gpt-preview
          rsync -a --delete \
            --exclude=.git \
            --exclude=.github \
            preview/ gpt-preview/
            rm -rf gpt-preview/data
            cp -a data gpt-preview/data
            rm -rf preview

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
